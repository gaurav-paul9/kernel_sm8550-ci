name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_susfs:
        description: 'KSU-Next + SUSFS'
        type: boolean
        default: true
        required: true
      build_droid:
        description: 'KSU-Next + DroidSpace'
        type: boolean
        default: false
        required: true

run-name: build (${{ github.run_number }})

jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          command -v kernel-setup-patches    || { echo "Missing kernel-setup-patches"; exit 1; }
          command -v kernel-setup-droidspace || { echo "Missing kernel-setup-droidspace"; exit 1; }
          /usr/lib/llvm-14/bin/clang --version | head -1

      - name: Multi-build
        env:
          KERNEL_REPO: https://github.com/gaurav-paul9/android_kernel_oneplus_sm8550.git
          KERNEL_BRANCH: yaap
        run: |
          DATE=$(date +%Y%m%d)

          for type in ksunsusfs ksundroidspace; do
            if [ "$type" = "ksunsusfs" ] && [ "${{ inputs.build_susfs }}" != "true" ]; then
              echo "Skipping ksunsusfs (not selected)"
              continue
            fi
            if [ "$type" = "ksundroidspace" ] && [ "${{ inputs.build_droid }}" != "true" ]; then
              echo "Skipping ksundroidspace (not selected)"
              continue
            fi

            echo "============================================"
            echo "  Building: $type"
            echo "============================================"

            KERNEL_SOURCE="${GITHUB_WORKSPACE}/kernel-source"

            # Fresh shallow clone
            echo "Cloning kernel source ($KERNEL_BRANCH)..."
            git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_SOURCE"

            # Apply patches and build
            export KERNEL_SOURCE_DIR="$KERNEL_SOURCE"

            if [ "$type" = "ksundroidspace" ]; then
              kernel-setup-droidspace
              LABEL="KSUN+droidspace"
            else
              kernel-setup-patches
              LABEL="KSUN+susfs"
            fi

            # Build
            kernel-build "${GITHUB_WORKSPACE}/build/out"

            # Make bootimg
            kernel-make-bootimg \
              "${GITHUB_WORKSPACE}/build/out/Image" \
              "${GITHUB_WORKSPACE}/boot-${LABEL}_${DATE}.img"

            echo "==> boot-${LABEL}_${DATE}.img ready"

            # Save .config
            mkdir -p "${GITHUB_WORKSPACE}/build/out/${type}"
            cp "$KERNEL_SOURCE/out/.config" "${GITHUB_WORKSPACE}/build/out/${type}/.config" 2>/dev/null || true

            # Remove kernel source
            echo "Cleaning up kernel source..."
            rm -rf "$KERNEL_SOURCE"
          done

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: boot-*.img
          compression-level: 0
          retention-days: 90

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/out/*.log
          retention-days: 90

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          CREATED=0

          for type in ksunsusfs ksundroidspace; do
            if [ "$type" = "ksunsusfs" ] && [ "${{ inputs.build_susfs }}" != "true" ]; then continue; fi
            if [ "$type" = "ksundroidspace" ] && [ "${{ inputs.build_droid }}" != "true" ]; then continue; fi

            if [ "$type" = "ksundroidspace" ]; then
              TAG="ksundroidspace-${DATE}"
              TITLE="boot-KSUN+droidspace ${DATE}"
              NOTES="KSU-Next + DroidSpace | built $(date)"
              IMG="boot-KSUN+droidspace_${DATE}.img"
            else
              TAG="ksunsusfs-${DATE}"
              TITLE="boot-KSUN+susfs ${DATE}"
              NOTES="KSU-Next + SUSFS | built $(date)"
              IMG="boot-KSUN+susfs_${DATE}.img"
            fi

            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" "$IMG" --clobber
            else
              gh release create "$TAG" "$IMG" \
                --title "$TITLE" --notes "$NOTES"
            fi
            CREATED=1
          done

          if [ "$CREATED" -eq 0 ]; then
            echo "Nothing selected — skipping release"
            exit 0
          fi

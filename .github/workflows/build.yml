name: Kernel Build

on:
  workflow_dispatch:

run-name: build $(date +%Y%m%d)

jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          command -v kernel-setup-patches || { echo "Missing kernel-setup-patches"; exit 1; }
          /usr/lib/llvm-14/bin/clang --version | head -1

      - name: Patch
        run: kernel-setup-patches
        timeout-minutes: 10

      - name: Build
        run: kernel-build "${GITHUB_WORKSPACE}/build/out"
        timeout-minutes: 90

      - name: Bootimg
        run: |
          DATE=$(date +%Y%m%d)
          kernel-make-bootimg \
            "${GITHUB_WORKSPACE}/build/out/Image" \
            "${GITHUB_WORKSPACE}/boot-KSUN+susfs_${DATE}.img"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSUN+susfs
          path: boot-KSUN+susfs_*.img
          compression-level: 0
          retention-days: 90

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/out/*.log
          retention-days: 90

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="ksunsusfs-${DATE}"
          NOTES="KSU-Next + SUSFS | built $(date)"
          IMG="boot-KSUN+susfs_${DATE}.img"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "$IMG" --clobber
          else
            gh release create "$TAG" "$IMG" \
              --title "boot-KSUN+susfs ${DATE}" --notes "$NOTES"
          fi
